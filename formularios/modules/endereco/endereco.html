<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        
    </style>
</head>
<body>
    <main>
        <div id="container">
            <h1>Cadastro de Endereço</h1>
            <form>  
                <div class="container-campo-formulario" style="grid-column: span 2;">
                    <label for="cep">Cep</label>
                    <input type="cep"  class="campo-formulario" name="cep" id="cep">
                </div>
                <div class="container-campo-formulario">
                    <label for="logradouro">Logradouro</label>
                    <input type="logradouro"  class="campo-formulario" name="logradouro" id="logradouro">
                </div>

                <div class="container-campo-formulario">
                    <label for="complemento">Complemento</label>
                    <input type="complemento"  class="campo-formulario" name="complemento" id="complemento">
                </div>

                <div class="container-campo-formulario">
                    <label for="numero">Numero</label>
                    <input type="numero"  class="campo-formulario" name="numero" id="numero">
                </div>
                
                <div class="container-campo-formulario">
                    <label for="bairro">Bairro</label>
                    <input type="bairro"  class="campo-formulario" name="bairro" id="bairro">
                </div>

                <div class="container-campo-formulario">
                    <label for="localidade">Cidade</label>
                    <input type="localidade"  class="campo-formulario" name="localidade" id="localidade">
                </div>

                <div class="container-campo-formulario">
                    <label for="estado">Estado</label>
                    <input type="estado"  class="campo-formulario" name="estado" id="estado">
                </div>

                <button id="btn-enviar" style="grid-column: 1;">Enviar</button>
            </form>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
